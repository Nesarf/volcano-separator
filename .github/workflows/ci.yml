name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless for a repo this size.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms still parse every source file; the suite itself runs on Windows only, because
        # what it asserts is Windows behaviour. See the Smoke step.
        os: [ubuntu-latest, windows-latest]
        # 20 is the declared floor in package.json; 24 is the current LTS.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The suite drives `uvx` through the warmth probe. Installed only for a manual run, because the suite
      # itself now runs only when someone asks for it -- see the Smoke step.
      - name: uv, which the warmth probe drives
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Node version
        run: node --version

      # Literally a syntax self-check: parse every source file without running it.
      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in lib/*.mjs bin/*.mjs test/*.mjs; do
            node --check "$f"
            echo "parsed  $f"
          done

      # Offline: no network, no uv, no hindsight daemon required.
      #
      # **Manual runs only, and Windows only.** The suite asserts behaviour of *this machine*: a process
      # started from a scratch directory, a binary that vanished, a vault key through DPAPI, a uvx build that
      # either resolves from cache or does not. On a runner those are approximations of the thing being
      # measured, and the failures they produce say "the runner is not this machine" -- which is true and not
      # useful. Push and pull request get the syntax check above; `workflow_dispatch` gets the suite, on the
      # platform it is about, with uv installed.
      - name: Smoke test
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: node test/smoke.mjs
