name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless for a repo this size.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms still parse every source file; the suite itself runs on Windows only, because
        # what it asserts is Windows behaviour. See the Smoke step.
        os: [ubuntu-latest, windows-latest]
        # 20 is the declared floor in package.json; 24 is the current LTS.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}


      - name: Node version
        run: node --version

      # Literally a syntax self-check: parse every source file without running it.
      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in lib/*.mjs bin/*.mjs test/*.mjs; do
            node --check "$f"
            echo "parsed  $f"
          done

      # **No suite here, on purpose.** `node test/smoke.mjs` measures this machine: a real service
      # listening on a port, a PostgreSQL instance under pg0, a warm uvx cache, DPAPI for the vault key.
      # A runner has none of those, and each missing piece produced a red run that meant "the runner is not
      # the development machine" -- true, and not something anyone should learn to ignore. Run the suite
      # locally; CI checks that every source file parses, on both platforms, which is a real check anywhere.
