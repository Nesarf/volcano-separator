name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless for a repo this size.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms still parse every source file; the suite itself runs on Windows only, because
        # what it asserts is Windows behaviour. See the Smoke step.
        os: [ubuntu-latest, windows-latest]
        # 20 is the declared floor in package.json; 24 is the current LTS.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The suite drives `uvx` through the warmth probe, and says so when it cannot: "no uvx" was the detail
      # on eight failed assertions, which is the tool reporting a missing dependency accurately rather than a
      # defect in it. Installed here so the assertions meet the thing they are about.
      - name: uv, which the warmth probe drives
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Node version
        run: node --version

      # Literally a syntax self-check: parse every source file without running it.
      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in lib/*.mjs bin/*.mjs test/*.mjs; do
            node --check "$f"
            echo "parsed  $f"
          done

      # Offline: no network, no uv, no hindsight daemon required.
      #
      # **Windows only, and the first run of this workflow proved why.** The suite asserts Windows behaviour:
      # a process started from a scratch directory, a binary that vanished, a vault key protected through
      # DPAPI. On ubuntu those assertions failed on behaviour that does not exist there, and the report read
      # "the tool is broken" rather than "this is a Windows tool". Ubuntu still runs the syntax check above,
      # which is a real check on a real platform.
      - name: Smoke test
        if: runner.os == 'Windows'
        run: node test/smoke.mjs
